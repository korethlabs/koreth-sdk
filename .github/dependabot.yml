# Dependabot version updates.
#
# Minor and patch bumps are grouped into a single weekly PR so routine upgrades cost
# one review rather than a dozen. Majors are deliberately left ungrouped: they can
# break at build time and each one deserves to be looked at on its own.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(dev-deps)
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(ci)
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types:
          - minor
          - patch
